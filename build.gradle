plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'uz.com'
version = '0.0.1-SNAPSHOT'
description = 'market-hub'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    configurations {
        all {exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'}}

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation "org.springframework.boot:spring-boot-starter-validation:${validation_version}"

    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    runtimeOnly 'org.postgresql:postgresql'
    implementation 'io.minio:minio:8.5.11'

    implementation "io.jsonwebtoken:jjwt-api:${jsonwebtoken_version}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jsonwebtoken_version}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jsonwebtoken_version}"
    implementation 'com.auth0:java-jwt:4.4.0'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation "org.apache.commons:commons-lang3:${commons_lang3}"
    implementation "commons-io:commons-io:${commons_io}"
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation "org.telegram:telegrambots:${telegram_version}"
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'net.sf.jasperreports:jasperreports:6.21.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

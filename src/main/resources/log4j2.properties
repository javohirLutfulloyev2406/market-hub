name = MarketHubLog4j2Config
status = warn

# Console appender
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Rolling file appender
appender.rolling.type = RollingFile
appender.rolling.name = RollingFileAppender
appender.rolling.fileName = logs/market-hub.log
appender.rolling.filePattern = logs/market-hub-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 30

# Root logger
rootLogger.level = info
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.rolling.ref = RollingFileAppender

# Application logger
logger.app.name = uz.com.markethub
logger.app.level = debug
logger.app.additivity = false
logger.app.appenderRef.console.ref = ConsoleAppender
logger.app.appenderRef.rolling.ref = RollingFileAppender

# Spring Web: debug
logger.springweb.name = org.springframework.web
logger.springweb.level = debug
logger.springweb.additivity = false
logger.springweb.appenderRef.console.ref = ConsoleAppender

# Hibernate: error only
logger.hibernate.name = org.hibernate
logger.hibernate.level = error
logger.hibernate.additivity = false
logger.hibernate.appenderRef.console.ref = ConsoleAppender